@if (studente(); as s) {
  <h1 class="h2 mb-3">Scheda dello studente</h1>
  <app-studente-card [studente]="s" (rimosso)="rimuovi($event)" />
  <div class="mt-3">
    <a class="btn btn-outline-secondary" routerLink="/elenco">Torna all'elenco</a>
    <button type="button" class="btn btn-primary ms-2" (click)="successivo()">Studente successivo</button>
  </div>
}
