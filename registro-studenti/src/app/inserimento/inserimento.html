<h1 class="h2 mb-3">Nuovo studente</h1>

<form #modulo="ngForm" (ngSubmit)="salva()" class="p-4 bg-white border rounded-3">
  <div class="mb-3">
    <label for="nome" class="form-label">Nome e cognome</label>
    <input id="nome" name="nome" class="form-control" [(ngModel)]="nome" required>
    @if (modulo.submitted && nome().trim() === '') {
      <div class="form-text text-danger">Inserisci il nome e cognome.</div>
    }
  </div>
  <div class="mb-3">
    <label for="classe" class="form-label">Classe</label>
    <input id="classe" name="classe" class="form-control" [(ngModel)]="classe" required>
    @if (modulo.submitted && classe().trim() === '') {
      <div class="form-text text-danger">Inserisci la classe.</div>
    }
  </div>
  <div class="mb-3">
    <label for="media" class="form-label">Media dei voti</label>
    <input id="media" name="media" type="number" class="form-control" [(ngModel)]="media" required min="1" max="10" step="0.1">
  </div>
  <button type="submit" class="btn btn-primary" [disabled]="modulo.invalid">Salva</button>
</form>
